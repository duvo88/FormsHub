steps:
- checkout: self
  clean: true
  
- task: UseDotNet@2
  displayName: 'Use .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

# Restore
- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: restore
    projects: '**/apps.sln'

# Build
- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: build
    projects: '**/api.csproj'
    arguments: '--configuration Release'

# Note: Vulnerability scanning handled by Wiz Scanner (branch policy)

# Unit Tests (run BEFORE deployment)
- task: DotNetCoreCLI@2
  displayName: 'Run Unit Tests'
  inputs:
    command: test
    projects: '**/FunctionApp.UnitTests.csproj'
    arguments: '--configuration Release --logger trx --results-directory $(Build.ArtifactStagingDirectory)/TestResults'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish Unit Test Results'
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/TestResults/**/*.trx'
    testRunTitle: 'Function App Unit Tests'

# Publish (NO ZIP)
- task: DotNetCoreCLI@2
  displayName: Publish
  inputs:
    command: publish
    publishWebProjects: false
    projects: '**/api.csproj'
    arguments: >
      --configuration Release
      --output $(Build.ArtifactStagingDirectory)/publish/api

# Fetch storage account connection string
- task: AzureCLI@2
  displayName: 'Fetch Storage Connection String'
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Fetching connection string for storage account: $(storageAccountName)"
      echo "Resource group: $(resourceGroupName)"
      
      storageConnString=$(az storage account show-connection-string \
        --name $(storageAccountName) \
        --resource-group $(resourceGroupName) \
        --query connectionString -o tsv 2>&1)
      
      exitCode=$?
      if [ $exitCode -ne 0 ]; then
        echo "##vso[task.logissue type=error]Failed to fetch storage connection string!"
        echo "##vso[task.logissue type=error]Storage account: $(storageAccountName)"
        echo "##vso[task.logissue type=error]Resource group: $(resourceGroupName)"
        echo "##vso[task.logissue type=error]Error: $storageConnString"
        exit 1
      fi
      
      if [ -z "$storageConnString" ]; then
        echo "##vso[task.logissue type=error]Storage connection string is empty!"
        echo "##vso[task.logissue type=error]Check that storage account $(storageAccountName) exists in resource group $(resourceGroupName)"
        exit 1
      fi
      
      echo "✅ Successfully fetched storage connection string"
      echo "##vso[task.setvariable variable=storageConnectionString;issecret=true]$storageConnString"

